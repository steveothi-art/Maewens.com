<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administration | AXEL Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #111111;
            --paper: #ffffff;
            --soft: #f4f4f2;
            --line: #deded9;
            --muted: #6b6b66;
            --red: #d6212c;
            --red-dark: #a91820;
            --green: #1d7a46;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            margin: 0;
            font-family: "Instrument Sans", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: var(--ink);
            background: var(--soft);
        }

        h1, h2 {
            font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif;
            font-weight: 800;
            line-height: 1.1;
            margin: 0;
        }

        :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

        /* ---------- Boutons et champs ---------- */
        button { font: inherit; cursor: pointer; }

        .btn {
            border: 1.5px solid var(--ink);
            background: var(--paper);
            color: var(--ink);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--ink); color: var(--paper); }
        .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
        .btn.primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
        .btn.small { padding: 6px 12px; font-size: 14px; }
        .btn.danger { color: var(--red); border-color: var(--red); }
        .btn.danger:hover { background: var(--red); color: #fff; }
        .btn:disabled { opacity: .55; cursor: wait; }

        label { display: block; font-weight: 600; margin-bottom: 6px; }
        .hint { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }

        input[type="text"], input[type="email"], input[type="password"], input[type="number"], select {
            width: 100%;
            font: inherit;
            padding: 11px 12px;
            border: 1.5px solid var(--line);
            border-radius: 6px;
            background: var(--paper);
            color: var(--ink);
        }
        input:focus, select:focus { border-color: var(--ink); }

        .message { margin: 14px 0 0; font-weight: 500; min-height: 1.5em; }
        .message.error { color: var(--red); }
        .message.ok { color: var(--green); }

        /* ---------- Connexion ---------- */
        .login {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 32px 28px;
        }
        .login-card h1 { font-size: 30px; margin-bottom: 6px; }
        .login-card p { margin: 0 0 22px; color: var(--muted); }
        .field { margin-bottom: 16px; }

        /* ---------- Administration ---------- */
        .topbar {
            background: var(--ink);
            color: var(--paper);
        }
        .topbar-inner {
            max-width: 980px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .topbar h1 { font-size: 22px; }
        .topbar .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .topbar .btn { background: transparent; color: var(--paper); border-color: #666; }
        .topbar .btn:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }

        main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }

        .panel {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .panel h2 { font-size: 24px; margin-bottom: 18px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .form-grid .wide { grid-column: 1 / -1; }
        .check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
        .check input { width: 20px; height: 20px; accent-color: var(--red); }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

        .list-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
            gap: 12px;
        }
        .list-head h2 { margin: 0; }
        .count { color: var(--muted); }

        .row {
            display: grid;
            grid-template-columns: 64px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 14px 0;
            border-top: 1px solid var(--line);
        }
        .row.is-hidden .thumb, .row.is-hidden .info { opacity: .5; }

        .thumb {
            width: 64px;
            height: 64px;
            border-radius: 6px;
            background: var(--soft);
            overflow: hidden;
            display: grid;
            place-items: center;
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 800;
            font-size: 24px;
            color: var(--muted);
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        .info strong { display: block; font-size: 17px; }
        .info span { display: inline-block; margin-right: 12px; color: var(--muted); font-size: 14px; }
        .info .price { color: var(--ink); font-weight: 600; }
        .tag { background: var(--ink); color: var(--paper) !important; padding: 1px 8px; border-radius: 4px; }
        .tag.off { background: var(--soft); color: var(--muted) !important; border: 1px solid var(--line); }

        .row-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

        .empty { padding: 28px 0 8px; color: var(--muted); }

        @media (max-width: 680px) {
            .form-grid { grid-template-columns: 1fr; }
            .row { grid-template-columns: 56px 1fr; }
            .thumb { width: 56px; height: 56px; }
            .row-actions { grid-column: 1 / -1; justify-content: flex-start; }
            .panel { padding: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>

<body>

    <!-- CONNEXION -->
    <section class="login" id="loginView">
        <div class="login-card">
            <h1>Administration AXEL</h1>
            <p>Connectez-vous pour gérer vos produits.</p>

            <form id="loginForm" autocomplete="on">
                <div class="field">
                    <label for="email">Adresse e-mail</label>
                    <input id="email" type="email" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input id="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn primary" id="loginBtn" type="submit">Se connecter</button>
                <p class="message" id="loginMsg" role="status"></p>
            </form>
        </div>
    </section>

    <!-- ADMINISTRATION -->
    <div id="adminView" hidden>
        <header class="topbar">
            <div class="topbar-inner">
                <h1>Gestion des produits</h1>
                <div class="actions">
                    <a class="btn small" href="index.html" target="_blank" rel="noopener">Voir la boutique</a>
                    <button class="btn small" id="logoutBtn" type="button">Se déconnecter</button>
                </div>
            </div>
        </header>

        <main>
            <section class="panel" id="formPanel">
                <h2 id="formTitle">Ajouter un produit</h2>

                <form id="productForm" novalidate>
                    <input type="hidden" id="productId">

                    <div class="form-grid">
                        <div>
                            <label for="name">Nom du produit</label>
                            <input id="name" type="text" maxlength="80" required>
                        </div>

                        <div>
                            <label for="price">Prix en FCFA</label>
                            <input id="price" type="number" min="0" step="1" inputmode="numeric" required>
                        </div>

                        <div>
                            <label for="category">Catégorie</label>
                            <select id="category" required></select>
                        </div>

                        <div>
                            <label for="badge">Badge <span class="hint">Facultatif, par exemple Nouveau ou Populaire.</span></label>
                            <input id="badge" type="text" maxlength="20">
                        </div>

                        <div class="wide">
                            <label for="image">Nom du fichier image <span class="hint">Le fichier doit être dans le dossier du site, à côté de index.html. Exemple : sweater.jpeg</span></label>
                            <input id="image" type="text" maxlength="120">
                        </div>

                        <div class="wide">
                            <label class="check" for="active">
                                <input id="active" type="checkbox" checked>
                                Visible dans la boutique
                            </label>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn primary" id="saveBtn" type="submit">Enregistrer le produit</button>
                        <button class="btn" id="cancelBtn" type="button" hidden>Annuler la modification</button>
                    </div>
                    <p class="message" id="formMsg" role="status"></p>
                </form>
            </section>

            <section class="panel">
                <div class="list-head">
                    <h2>Vos produits</h2>
                    <span class="count" id="count"></span>
                </div>
                <div id="list"></div>
            </section>
        </main>
    </div>

    <script>
    (() => {
        "use strict";

        const SUPABASE_URL = "https://snmezmufubfprpkeketw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Hg9RT3YQWrlxM8HGGEUklA_Ln8csLiU";

        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const fcfa = n => `${new Intl.NumberFormat("fr-FR").format(n).replace(/\u202f|\u00a0/g, " ")} FCFA`;

        const state = { products: [], categories: [] };

        /* ---------- Session (valable tant que l'onglet reste ouvert) ---------- */
        const session = {
            get() { try { return JSON.parse(sessionStorage.getItem("axel_admin")); } catch { return null; } },
            set(v) { try { sessionStorage.setItem("axel_admin", JSON.stringify(v)); } catch { /* indisponible */ } },
            clear() { try { sessionStorage.removeItem("axel_admin"); } catch { /* indisponible */ } }
        };

        async function login(email, password) {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: "POST",
                headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            if (!res.ok) throw new Error("E-mail ou mot de passe incorrect.");
            const d = await res.json();
            session.set({ access_token: d.access_token, refresh_token: d.refresh_token });
        }

        async function refresh() {
            const s = session.get();
            if (!s || !s.refresh_token) return false;
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
                method: "POST",
                headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({ refresh_token: s.refresh_token })
            });
            if (!res.ok) return false;
            const d = await res.json();
            session.set({ access_token: d.access_token, refresh_token: d.refresh_token });
            return true;
        }

        function showLogin(message = "") {
            session.clear();
            $("#adminView").hidden = true;
            $("#loginView").hidden = false;
            setMsg($("#loginMsg"), message, "error");
        }

        function showAdmin() {
            $("#loginView").hidden = true;
            $("#adminView").hidden = false;
        }

        /* ---------- Appels à la base ---------- */
        async function api(path, opts = {}, canRetry = true) {
            const s = session.get();
            const headers = { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(opts.headers || {}) };
            if (s) headers.Authorization = `Bearer ${s.access_token}`;

            const res = await fetch(`${SUPABASE_URL}${path}`, {
                method: opts.method || "GET",
                headers,
                body: opts.body ? JSON.stringify(opts.body) : undefined
            });

            if (res.status === 401) {
                if (canRetry && s && await refresh()) return api(path, opts, false);
                showLogin("Votre session a expiré. Reconnectez-vous.");
                throw new Error("Session expirée.");
            }

            const text = await res.text();
            if (!res.ok) {
                let msg = `Erreur ${res.status}`;
                try { const j = JSON.parse(text); msg = j.message || j.msg || msg; } catch { /* texte brut */ }
                throw new Error(msg);
            }
            return text ? JSON.parse(text) : null;
        }

        async function loadData() {
            const [cats, prods] = await Promise.all([
                api("/rest/v1/categories?select=id,name&order=name.asc"),
                api("/rest/v1/products?select=id,name,price,image_url,badge,is_active,category_id,category:categories(name)&order=id.asc")
            ]);
            state.categories = cats;
            state.products = prods;
            renderCategories();
            renderList();
        }

        /* ---------- Affichage ---------- */
        function setMsg(node, text, kind) {
            node.textContent = text;
            node.className = `message ${text ? kind : ""}`;
        }

        function renderCategories() {
            const current = $("#category").value;
            $("#category").innerHTML = state.categories
                .map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
            if (current) $("#category").value = current;
        }

        function renderList() {
            const list = $("#list");
            $("#count").textContent = `${state.products.length} produit${state.products.length > 1 ? "s" : ""}`;

            if (state.products.length === 0) {
                list.innerHTML = `<p class="empty">Aucun produit pour l'instant. Utilisez le formulaire ci-dessus pour ajouter le premier.</p>`;
                return;
            }

            list.innerHTML = state.products.map(p => `
                <div class="row ${p.is_active ? "" : "is-hidden"}">
                    <div class="thumb">
                        ${p.image_url
                            ? `<img src="${esc(p.image_url)}" alt="">`
                            : esc(p.name.charAt(0))}
                    </div>
                    <div class="info">
                        <strong>${esc(p.name)}</strong>
                        <span>${esc(p.category ? p.category.name : "Sans catégorie")}</span>
                        <span class="price">${fcfa(p.price)}</span>
                        ${p.badge ? `<span class="tag">${esc(p.badge)}</span>` : ""}
                        ${p.is_active ? "" : `<span class="tag off">Masqué</span>`}
                    </div>
                    <div class="row-actions">
                        <button class="btn small" type="button" data-edit="${p.id}">Modifier</button>
                        <button class="btn small" type="button" data-toggle="${p.id}">${p.is_active ? "Masquer" : "Afficher"}</button>
                        <button class="btn small danger" type="button" data-delete="${p.id}">Supprimer</button>
                    </div>
                </div>`).join("");
        }

        /* ---------- Formulaire ---------- */
        function resetForm() {
            $("#productForm").reset();
            $("#productId").value = "";
            $("#active").checked = true;
            $("#formTitle").textContent = "Ajouter un produit";
            $("#saveBtn").textContent = "Enregistrer le produit";
            $("#cancelBtn").hidden = true;
        }

        function editProduct(id) {
            const p = state.products.find(x => x.id === id);
            if (!p) return;
            $("#productId").value = p.id;
            $("#name").value = p.name;
            $("#price").value = p.price;
            $("#category").value = p.category_id ?? "";
            $("#badge").value = p.badge || "";
            $("#image").value = p.image_url || "";
            $("#active").checked = p.is_active;
            $("#formTitle").textContent = `Modifier : ${p.name}`;
            $("#saveBtn").textContent = "Enregistrer les modifications";
            $("#cancelBtn").hidden = false;
            setMsg($("#formMsg"), "", "");
            $("#formPanel").scrollIntoView({ behavior: "smooth", block: "start" });
            $("#name").focus();
        }

        async function saveProduct(e) {
            e.preventDefault();
            const msg = $("#formMsg");

            const name = $("#name").value.trim();
            const price = Number($("#price").value);

            if (!name) return setMsg(msg, "Entrez le nom du produit.", "error");
            if ($("#price").value === "" || !Number.isInteger(price) || price < 0)
                return setMsg(msg, "Entrez un prix en FCFA, en nombre entier (exemple : 5000).", "error");

            const payload = {
                name,
                price,
                category_id: Number($("#category").value) || null,
                image_url: $("#image").value.trim() || null,
                badge: $("#badge").value.trim() || null,
                is_active: $("#active").checked
            };

            const id = $("#productId").value;
            $("#saveBtn").disabled = true;
            setMsg(msg, "Enregistrement en cours…", "ok");

            try {
                await api(id ? `/rest/v1/products?id=eq.${encodeURIComponent(id)}` : "/rest/v1/products", {
                    method: id ? "PATCH" : "POST",
                    headers: { Prefer: "return=minimal" },
                    body: payload
                });
                await loadData();
                resetForm();
                setMsg(msg, id ? "Produit modifié." : "Produit ajouté.", "ok");
            } catch (err) {
                setMsg(msg, `Enregistrement impossible : ${err.message}`, "error");
            } finally {
                $("#saveBtn").disabled = false;
            }
        }

        async function toggleProduct(id) {
            const p = state.products.find(x => x.id === id);
            if (!p) return;
            try {
                await api(`/rest/v1/products?id=eq.${id}`, {
                    method: "PATCH",
                    headers: { Prefer: "return=minimal" },
                    body: { is_active: !p.is_active }
                });
                await loadData();
            } catch (err) {
                setMsg($("#formMsg"), `Action impossible : ${err.message}`, "error");
            }
        }

        async function deleteProduct(id) {
            const p = state.products.find(x => x.id === id);
            if (!p) return;
            if (!confirm(`Supprimer « ${p.name} » définitivement ? Cette action est irréversible.\n\nPour seulement le retirer de la boutique, utilisez plutôt « Masquer ».`)) return;
            try {
                await api(`/rest/v1/products?id=eq.${id}`, {
                    method: "DELETE",
                    headers: { Prefer: "return=minimal" }
                });
                if ($("#productId").value === String(id)) resetForm();
                await loadData();
                setMsg($("#formMsg"), "Produit supprimé.", "ok");
            } catch (err) {
                setMsg($("#formMsg"), `Suppression impossible : ${err.message}`, "error");
            }
        }

        /* ---------- Événements ---------- */
        $("#loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            const btn = $("#loginBtn");
            btn.disabled = true;
            setMsg($("#loginMsg"), "Connexion en cours…", "ok");
            try {
                await login($("#email").value.trim(), $("#password").value);
                $("#password").value = "";
                setMsg($("#loginMsg"), "", "");
                showAdmin();
                await loadData();
            } catch (err) {
                setMsg($("#loginMsg"), err.message, "error");
            } finally {
                btn.disabled = false;
            }
        });

        $("#logoutBtn").addEventListener("click", () => showLogin(""));
        $("#productForm").addEventListener("submit", saveProduct);
        $("#cancelBtn").addEventListener("click", () => { resetForm(); setMsg($("#formMsg"), "", ""); });

        $("#list").addEventListener("click", e => {
            const b = e.target.closest("button");
            if (!b) return;
            if (b.dataset.edit) editProduct(Number(b.dataset.edit));
            else if (b.dataset.toggle) toggleProduct(Number(b.dataset.toggle));
            else if (b.dataset.delete) deleteProduct(Number(b.dataset.delete));
        });

        /* ---------- Démarrage ---------- */
        if (session.get()) {
            showAdmin();
            loadData().catch(() => { /* api() ramène à la connexion si la session est invalide */ });
        }
    })();
    </script>
</body>
</html>
